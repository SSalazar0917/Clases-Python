function rQuizTF(s){
  const qid=s.qid;
  const qs=s.qs.map((q,i)=>`<div style="background:#161b22;border-radius:.75rem;padding:.7rem .9rem;border:1px solid #30363d;"><p style="font-size:.83rem;margin-bottom:.55rem;line-height:1.5;">${q.s}</p><div style="display:flex;gap:.5rem;"><button class="vfb" id="vf_${qid}_${i}_t" onclick="selTF('${qid}',${i},true)">&#x2713; Verdadero</button><button class="vfb" id="vf_${qid}_${i}_f" onclick="selTF('${qid}',${i},false)">&#x2717; Falso</button></div></div>`).join('');
  return`<div style="display:flex;flex-direction:column;height:100%;gap:.85rem;">
    <div style="display:flex;align-items:center;gap:.5rem;flex-shrink:0;"><span style="background:rgba(234,88,12,.18);color:#fb923c;border:1px solid rgba(234,88,12,.3);border-radius:9999px;padding:.15rem .7rem;font-size:.75rem;font-weight:700;">&#x1F7E2;&#x1F534; Verdadero o Falso</span><span style="color:#8b949e;font-size:.75rem;">${s.pts} puntos</span></div>
    <p style="font-size:1.1rem;font-weight:800;flex-shrink:0;">${s.title||'&#xa1;Verdadero o Falso!'}</p>
    <div style="display:flex;flex-direction:column;gap:.55rem;flex:1;overflow-y:auto;" class="scr">${qs}</div>
    <div id="tffb_${qid}" style="display:none;border-radius:.7rem;padding:.6rem .9rem;font-size:.82rem;border:1px solid;flex-shrink:0;"></div>
    <button id="tfvbtn_${qid}" onclick="verTF('${qid}')" style="padding:.4rem 1.3rem;border-radius:.6rem;background:#ea580c;color:white;border:none;cursor:pointer;font-size:.82rem;font-weight:700;align-self:flex-start;flex-shrink:0;${answered[qid]?'display:none;':''}">Verificar Todo &#x2192;</button>
  </div>`;}
const tfS={};
function selTF(qid,idx,val){
  if(answered[qid])return;if(!tfS[qid])tfS[qid]={};tfS[qid][idx]=val;
  document.getElementById(`vf_${qid}_${idx}_t`).className='vfb'+(val?' vs':'');
  document.getElementById(`vf_${qid}_${idx}_f`).className='vfb'+(!val?' fs':'');}
function verTF(qid){
  const s=SLIDES[activeClass][slideIdx];const sel=tfS[qid]||{};let correct=0;
  s.qs.forEach((q,i)=>{const ua=sel[i];const ok=(ua===q.a);if(ok)correct++;
    const tb=document.getElementById(`vf_${qid}_${i}_t`);const fb=document.getElementById(`vf_${qid}_${i}_f`);
    tb.classList.add('locked');fb.classList.add('locked');
    if(q.a===true){tb.className='vfb vok locked';if(ua===false)fb.className='vfb fox locked';}
    else{fb.className='vfb vok locked';if(ua===true)tb.className='vfb fox locked';}});
  answered[qid]=true;document.getElementById(`tfvbtn_${qid}`).style.display='none';
  const pct=Math.round(correct/s.qs.length*100);const pts=pct>=80?s.pts:pct>=60?Math.round(s.pts*.6):0;
  if(pts>0&&!answered[qid+':s']){answered[qid+':s']=true;addScore(pts);}
  const fbl=document.getElementById(`tffb_${qid}`);fbl.style.display='block';const isG=correct>=4;
  fbl.innerHTML=`<strong>${correct}/${s.qs.length} correctas</strong> (${pct}%) ${pts>0?`&mdash; <span style="color:#facc15;">+${pts} pts</span>`:'&mdash; &#xa1;Sigue practicando!'}`;
  fbl.style.cssText=`display:block;border-radius:.7rem;padding:.6rem .9rem;font-size:.82rem;border:1px solid;flex-shrink:0;background:${isG?'rgba(22,101,52,.18)':'rgba(120,53,15,.18)'};border-color:${isG?'#166534':'#92400e'};color:${isG?'#86efac':'#fde68a'};`;}

function rQuizFinal(s){if(!finalSt.started)finalSt={idx:0,score:0,done:false,started:true};return rFQ(s);}
function rFQ(s){
  if(finalSt.done)return rFR(s);
  const qi=finalSt.idx;const q=s.qs[qi];const L=['A','B','C','D'];
  const prog=s.qs.map((_,i)=>`<div style="height:4px;flex:1;border-radius:9999px;background:${i<qi?'#22c55e':i===qi?'#60a5fa':'#21262d'};transition:background .3s;"></div>`).join('');
  const opts=q.opts.map((o,i)=>`<div class="qopt" id="fopt_${i}" onclick="selF(${i})" style="border-radius:.75rem;padding:.75rem 1rem;background:#161b22;display:flex;align-items:center;gap:.75rem;"><div id="fltr_${i}" style="width:1.8rem;height:1.8rem;border-radius:50%;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#8b949e;flex-shrink:0;">${L[i]}</div><span style="font-size:.88rem;">${o}</span></div>`).join('');
  return`<div style="display:flex;flex-direction:column;height:100%;gap:.9rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;"><span style="background:rgba(234,179,8,.15);color:#fbbf24;border:1px solid rgba(234,179,8,.3);border-radius:9999px;padding:.15rem .8rem;font-size:.78rem;font-weight:700;">${s.title}</span><span style="color:#8b949e;font-size:.78rem;">Pregunta ${qi+1} de ${s.qs.length}</span></div>
    <div style="display:flex;gap:.4rem;">${prog}</div>
    <p style="font-size:1.1rem;font-weight:700;line-height:1.45;flex-shrink:0;">${q.q}</p>
    <div style="display:flex;flex-direction:column;gap:.55rem;flex:1;overflow-y:auto;" class="scr" id="final_opts">${opts}</div>
    <div id="final_fb" style="display:none;border-radius:.75rem;padding:.65rem 1rem;font-size:.85rem;border:1px solid;flex-shrink:0;"></div>
    <div style="display:flex;gap:.6rem;flex-shrink:0;">
      <button id="final_vbtn" onclick="verF()" style="padding:.4rem 1.2rem;border-radius:.6rem;background:#b45309;color:white;border:none;cursor:pointer;font-size:.82rem;font-weight:700;">Verificar &#x2192;</button>
      <button id="final_nbtn" onclick="nextF()" style="display:none;padding:.4rem 1.2rem;border-radius:.6rem;background:#1d4ed8;color:white;border:none;cursor:pointer;font-size:.82rem;font-weight:700;">${qi<s.qs.length-1?'Siguiente &#x2192;':'Ver Resultados &#x1F3C6;'}</button>
    </div>
  </div>`;}
function selF(idx){
  finalChosen=idx;
  [0,1,2,3].forEach(i=>{const el=document.getElementById('fopt_'+i);const ltr=document.getElementById('fltr_'+i);if(i===idx){el.classList.add('sel');ltr.style.background='rgba(88,166,255,.25)';ltr.style.color='#58a6ff';}else{el.classList.remove('sel');ltr.style.background='';ltr.style.color='';}});}
function verF(){
  if(finalChosen<0){alert('Selecciona una opci\u00f3n.');return;}
  const s=SLIDES[activeClass][slideIdx];const q=s.qs[finalSt.idx];const ok=finalChosen===q.ok;
  document.getElementById('final_vbtn').style.display='none';document.getElementById('final_nbtn').style.display='';document.getElementById('final_opts').style.pointerEvents='none';
  q.opts.forEach((_,i)=>{const el=document.getElementById('fopt_'+i);const ltr=document.getElementById('fltr_'+i);el.classList.add('locked');
    if(i===q.ok){el.classList.add('good');ltr.style.background='rgba(80,250,123,.25)';ltr.style.color='#50fa7b';}
    else if(i===finalChosen&&!ok){el.classList.add('bad');ltr.style.background='rgba(255,85,85,.2)';ltr.style.color='#ff5555';}});
  if(ok){finalSt.score+=q.pts;const fqk='fq'+finalSt.idx;if(!answered[fqk+':s']){answered[fqk+':s']=true;addScore(q.pts);}}
  const fb=document.getElementById('final_fb');fb.style.display='block';
  fb.innerHTML=ok?`<span style="color:#22c55e;font-weight:700;">&#x2705; &#xa1;Correcto! +${q.pts} pts</span>`:`<span style="color:#ef4444;font-weight:700;">&#x274C; Incorrecto.</span> La respuesta era: <strong style="color:#22c55e;">${q.opts[q.ok]}</strong>`;
  fb.style.cssText=`display:block;border-radius:.75rem;padding:.65rem 1rem;font-size:.85rem;border:1px solid;flex-shrink:0;background:${ok?'rgba(22,101,52,.18)':'rgba(127,29,29,.18)'};border-color:${ok?'#166534':'#7f1d1d'};color:${ok?'#86efac':'#fca5a5'};`;}
function nextF(){
  finalChosen=-1;finalSt.idx++;
  const s=SLIDES[activeClass][slideIdx];if(finalSt.idx>=s.qs.length)finalSt.done=true;
  document.getElementById('main').innerHTML=`<div class="anim" style="height:100%;">${rFQ(s)}</div>`;}
function rFR(s){
  const total=s.qs.reduce((a,q)=>a+q.pts,0);const pct=Math.round(finalSt.score/total*100);
  const medal=pct>=80?'&#x1F947;':pct>=60?'&#x1F948;':pct>=40?'&#x1F949;':'&#x1F4DA;';
  const msg=pct>=80?'&#xa1;Excelente trabajo!':pct>=60?'&#xa1;Muy bien!':pct>=40?'&#xa1;Buen esfuerzo!':'&#xa1;Sigue practicando!';
  return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1.1rem;text-align:center;">
    <div style="font-size:4.5rem;">${medal}</div><h2 style="font-size:2rem;font-weight:900;">${msg}</h2>
    <div style="background:#161b22;border-radius:1rem;padding:1.4rem 2rem;border:1px solid #30363d;min-width:14rem;">
      <div style="font-size:3rem;font-weight:900;color:#facc15;">${finalSt.score}<span style="font-size:1.4rem;color:#8b949e;"> / ${total}</span></div>
      <div style="color:#8b949e;font-size:.82rem;margin-top:.25rem;">puntos en el Quiz Final</div>
      <div style="margin-top:.75rem;background:#21262d;border-radius:9999px;height:.55rem;overflow:hidden;"><div style="height:100%;background:#facc15;width:${pct}%;"></div></div>
      <div style="font-size:.8rem;color:#8b949e;margin-top:.25rem;">${pct}%</div>
    </div>
    <div style="background:#161b22;border-radius:.75rem;padding:.65rem 1.2rem;border:1px solid #30363d;">
      <span style="color:#8b949e;font-size:.82rem;">Puntaje total del curso: </span><span style="font-weight:800;color:#facc15;font-size:1rem;">${totalScore} pts</span>
    </div>
  </div>`;}

function rClosing(s){
  const items=s.items.map(it=>`<div style="background:#161b22;border-radius:.7rem;padding:.65rem .9rem;border:1px solid #30363d;font-size:.85rem;">${it}</div>`).join('');
  const scoreEl=s.isFinal?`<div style="background:#161b22;border-radius:1rem;padding:1rem;border:1px solid rgba(234,179,8,.35);text-align:center;flex-shrink:0;"><div style="font-size:2.4rem;font-weight:900;color:#facc15;">${totalScore} pts</div><div style="color:#8b949e;font-size:.78rem;">Puntaje total del curso &#x1F3C6;</div></div>`:'';
  return`<div style="display:flex;flex-direction:column;height:100%;gap:.85rem;overflow-y:auto;" class="scr">
    <h2 style="font-size:1.5rem;font-weight:900;flex-shrink:0;">${s.title}</h2>
    <div style="display:flex;flex-direction:column;gap:.45rem;">${items}</div>
    <div style="background:#1c2128;border-radius:.75rem;padding:.75rem 1rem;border-left:3px solid #facc15;flex-shrink:0;"><p style="font-size:.84rem;line-height:1.6;color:#c9d1d9;">${s.reto}</p></div>
    <div style="background:#161b22;border-radius:.75rem;padding:.7rem 1rem;border:1px solid #30363d;display:flex;align-items:center;gap:.7rem;flex-shrink:0;"><span style="font-size:1.4rem;">&#x1F680;</span><div><p style="font-size:.72rem;color:#8b949e;">Siguiente paso:</p><p style="font-size:.84rem;">${s.sig}</p></div></div>
    ${scoreEl}
  </div>`;}

function rBonus(s){
  const bid='bonus'+slideIdx;const codeHTML=tok(s.tokens);
  const pts=s.pts.map(p=>`<div style="display:flex;align-items:flex-start;gap:.5rem;background:#161b22;border-radius:.6rem;padding:.6rem .85rem;border:1px solid #30363d;font-size:.82rem;color:#c9d1d9;"><span style="color:#facc15;flex-shrink:0;">&#x2605;</span>${p}</div>`).join('');
  return`<div style="display:flex;flex-direction:column;height:100%;gap:.75rem;overflow-y:auto;" class="scr">
    <div style="flex-shrink:0;"><span style="background:rgba(234,179,8,.15);color:#fbbf24;border:1px solid rgba(234,179,8,.3);border-radius:9999px;padding:.2rem .75rem;font-size:.76rem;font-weight:700;">${s.badge}</span></div>
    <h2 style="font-size:1.3rem;font-weight:800;flex-shrink:0;">${s.title}</h2>
    <p style="color:#8b949e;font-size:.84rem;flex-shrink:0;">${s.intro}</p>
    <div style="background:#282a36;border-radius:.85rem;overflow:hidden;border:1px solid #44475a;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:.45rem;padding:.4rem .85rem;background:#21222c;border-bottom:1px solid #44475a;">
        <div style="display:flex;gap:.3rem;"><div style="width:10px;height:10px;border-radius:50%;background:#ff5f56;"></div><div style="width:10px;height:10px;border-radius:50%;background:#ffbd2e;"></div><div style="width:10px;height:10px;border-radius:50%;background:#27c93f;"></div></div>
        <span style="font-family:monospace;font-size:.72rem;color:#6272a4;margin-left:.3rem;">${s.title.toLowerCase().replace(/ /g,'_')}.py</span>
        <button onclick="runB('${bid}')" style="margin-left:auto;padding:.18rem .65rem;border-radius:.35rem;background:#166534;color:#86efac;border:none;cursor:pointer;font-size:.73rem;font-weight:700;">&#x25B6; Ejecutar</button>
      </div>
      <pre style="padding:.85rem 1rem;font-size:.82rem;line-height:1.6;color:#f8f8f2;margin:0;overflow-x:auto;" class="mono scr">${codeHTML}</pre>
      <div id="${bid}" style="display:none;border-top:1px solid #44475a;background:#191a21;padding:.55rem 1rem;max-height:7rem;overflow-y:auto;" class="scr">
        <div style="font-size:.7rem;color:#50fa7b;margin-bottom:.3rem;font-family:monospace;">&#x25B6; Salida:</div>
        <div id="${bid}_t" style="font-family:monospace;font-size:.8rem;color:#f8f8f2;line-height:1.6;"></div>
      </div>
    </div>
    <div style="flex-shrink:0;"><p style="font-size:.72rem;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem;">Puntos clave</p><div style="display:flex;flex-direction:column;gap:.4rem;">${pts}</div></div>
  </div>`;}
function runB(bid){
  const s=SLIDES[activeClass][slideIdx];const panel=document.getElementById(bid);const txtEl=document.getElementById(bid+'_t');
  panel.style.display='block';txtEl.innerHTML='';const lines=s.out.split('\n');let i=0;
  const go=()=>{if(i>=lines.length)return;txtEl.innerHTML+=(i?'<br>':'')+esc(lines[i++]);setTimeout(go,100);};go();}

function rQuiz(s){switch(s.qtype){case 'single':return rQuizSingle(s);case 'multi':return rQuizMulti(s);case 'text':return rQuizText(s);case 'tf':return rQuizTF(s);case 'final':return rQuizFinal(s);}}

// â”€â”€ NAV â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function render(){
  const slides=SLIDES[activeClass];const s=slides[slideIdx];const total=slides.length;
  document.getElementById('progFill').style.width=((slideIdx+1)/total*100)+'%';
  document.getElementById('slideLabel').textContent=`${slideIdx+1} / ${total}`;
  const prev=document.getElementById('btnPrev');prev.disabled=slideIdx===0;prev.style.opacity=slideIdx===0?.35:1;
  const nBtn=document.getElementById('btnNext');nBtn.textContent=slideIdx===total-1&&activeClass==='clase1'?'Ir a Clase 2 \u2192':'Siguiente \u2192';
  const dotNav=document.getElementById('dotNav');
  dotNav.innerHTML=slides.map((_,i)=>{
    const isB=slides[i].type==='bonus';
    let bg=i<slideIdx?(isB?'#a16207':'#22c55e'):i===slideIdx?(isB?'#facc15':'#ffffff'):'#30363d';
    return`<div class="dot" onclick="goTo(${i})" title="Slide ${i+1}" style="background:${bg};${i===slideIdx?'transform:scale(1.3);':''}"></div>`;}).join('');
  let html='';
  switch(s.type){case 'cover':html=rCover(s);break;case 'concept':html=rConcept(s);break;case 'code':html=rCode(s);break;case 'quiz':html=rQuiz(s);break;case 'closing':html=rClosing(s);break;case 'bonus':html=rBonus(s);break;default:html='<p>Slide no encontrado</p>';}
  document.getElementById('main').innerHTML=`<div class="anim" style="height:100%;">${html}</div>`;
  document.getElementById('scoreEl').textContent=totalScore+' pts';}

function navigate(dir){
  const slides=SLIDES[activeClass];const next=slideIdx+dir;
  if(next<0||next>=slides.length){if(dir>0&&activeClass==='clase1'){setClass(2);return;}return;}
  slideIdx=next;resetFI();render();}
function goTo(i){slideIdx=i;resetFI();render();}
function resetFI(){const s=SLIDES[activeClass][slideIdx];if(s.type==='quiz'&&s.qtype==='final')finalSt={idx:0,score:0,done:false,started:false};}
function setClass(cls){
  activeClass='clase'+cls;slideIdx=0;finalSt={idx:0,score:0,done:false,started:false};
  const t1=document.getElementById('tab1');const t2=document.getElementById('tab2');
  if(cls===1){t1.style.cssText='padding:.25rem 1rem;border-radius:.4rem;font-size:.8rem;font-weight:700;border:none;cursor:pointer;background:#22c55e;color:#000;transition:all .2s;';t2.style.cssText='padding:.25rem 1rem;border-radius:.4rem;font-size:.8rem;font-weight:700;border:none;cursor:pointer;background:transparent;color:#8b949e;transition:all .2s;';}
  else{t1.style.cssText='padding:.25rem 1rem;border-radius:.4rem;font-size:.8rem;font-weight:700;border:none;cursor:pointer;background:transparent;color:#8b949e;transition:all .2s;';t2.style.cssText='padding:.25rem 1rem;border-radius:.4rem;font-size:.8rem;font-weight:700;border:none;cursor:pointer;background:#3b82f6;color:#fff;transition:all .2s;';}
  render();}
function addScore(pts){
  totalScore+=pts;document.getElementById('scoreEl').textContent=totalScore+' pts';
  const box=document.getElementById('scoreBox');box.classList.add('glow');setTimeout(()=>box.classList.remove('glow'),2000);}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();navigate(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1);}});
render();
</script>
</body>
</html>
